<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Flexbox - Quadro</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <!-- Linha 1: 100% -->
    <div class="container">
        <div class="col-100">100%</div>
    </div>

    <!-- Linha 2: 50% | 50% -->
    <div class="container">
        <div class="col-50">50%</div>
        <div class="col-50">50%</div>
    </div>

    <!-- Linha 3: 70% | 30% -->
    <div class="container">
        <div class="col-70">70%</div>
        <div class="col-30">30%</div>
    </div>

    <!-- Linha 4: 30% | 30% | 30% -->
    <div class="container centralizado">
        <div class="col-30">30%</div>
        <div class="col-30">30%</div>
        <div class="col-30">30%</div>
    </div>

    <!-- Linha 5: 70% | 30% -->
    <div class="container">
        <div class="col-70">70%</div>
        <div class="col-30">30%</div>
    </div>

</body>
</html>
