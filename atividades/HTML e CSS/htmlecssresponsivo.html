<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Media Queries</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      transition: background-color 0.4s ease, font-size 0.4s ease;
    }

    @media (max-width: 767px) {
      body {
        background-color: #ff6b6b;
      }
      h1 {
        font-size: 1.5rem;
        color: #ffffff;
      }
    }

    @media (min-width: 768px) {
      body {
        background-color: #87ceeb;
      }
      h1 {
        font-size: 2.2rem;
        color: #1a1a1a;
      }
    }

    @media (min-width: 1024px) {
      body {
        background-color: #90ee90;
      }
      h1 {
        font-size: 3rem;
        color: #1a1a1a;
      }
    }

    @media (min-width: 1440px) {
      body {
        background-color: #dcd6f7;
      }
      h1 {
        font-size: 4rem;
        color: #111111;
      }
    }
  </style>
</head>
<body>

  <h1>Título Responsivo com Media Queries</h1>

</body>
</html>
